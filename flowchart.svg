<svg xmlns="http://www.w3.org/2000/svg" width="820" height="880" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="820" height="880" fill="#f8fafc" rx="10"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">NightNight — Program Flow</text>

  <!-- ── BOOT ── -->
  <rect x="260" y="50" width="300" height="38" rx="19" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="410" y="74" text-anchor="middle" fill="#3b0764" font-weight="bold">Boot / Deep Sleep Wake</text>

  <line x1="410" y1="88" x2="410" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── INIT ── -->
  <rect x="210" y="110" width="400" height="52" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="131" text-anchor="middle" fill="#1e3a5f">Disable WiFi &amp; BT · Init RTC</text>
  <text x="410" y="150" text-anchor="middle" fill="#1e3a5f">Config pins · Release GPIO hold</text>

  <line x1="410" y1="162" x2="410" y2="187" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── WAKEUP DECISION ── center (410, 215), hw=150, hh=28 -->
  <polygon points="410,187 560,215 410,243 260,215" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="410" y="211" text-anchor="middle" fill="#451a03" font-size="12">Wakeup == DS3231 alarm?</text>
  <text x="410" y="227" text-anchor="middle" fill="#6b4600" font-size="11">(GPIO3 pulled LOW)</text>

  <!-- NO: corner path left then down -->
  <path d="M 260,215 L 110,215 L 110,278" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="182" y="208" text-anchor="middle" fill="#666" font-size="11">NO</text>

  <!-- NO: Set alarm -->
  <rect x="35" y="278" width="150" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="301" text-anchor="middle" fill="#1e3a5f">Set next 12 AM alarm</text>

  <line x1="110" y1="314" x2="110" y2="354" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NO: Deep sleep -->
  <rect x="35" y="354" width="150" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="110" y="377" text-anchor="middle" fill="#14532d" font-weight="bold">Enter Deep Sleep</text>

  <!-- YES: down -->
  <line x1="410" y1="243" x2="410" y2="275" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="422" y="262" fill="#666" font-size="11">YES</text>

  <!-- ── CLEAR ALARM ── -->
  <rect x="240" y="275" width="340" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="298" text-anchor="middle" fill="#1e3a5f">Clear DS3231 alarm flag</text>

  <line x1="410" y1="311" x2="410" y2="341" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── EXTEND ACTUATOR ── -->
  <rect x="240" y="341" width="340" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="364" text-anchor="middle" fill="#1e3a5f">Extend Actuator</text>

  <line x1="410" y1="377" x2="410" y2="407" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── RETRACT ACTUATOR ── -->
  <rect x="240" y="407" width="340" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="430" text-anchor="middle" fill="#1e3a5f">Retract Actuator</text>

  <line x1="410" y1="443" x2="410" y2="473" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── BATTERY LOOP (dashed) ── -->
  <rect x="210" y="473" width="400" height="76" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="410" y="494" text-anchor="middle" fill="#7f1d1d" font-weight="bold">Low-Battery Alert Loop</text>
  <text x="410" y="513" text-anchor="middle" fill="#991b1b" font-size="12">While battery low: flash RED LED × 120 (2 min)</text>
  <text x="410" y="531" text-anchor="middle" fill="#991b1b" font-size="12">then light sleep 8 min — repeat until recovered</text>

  <line x1="410" y1="549" x2="410" y2="577" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── BATTERY LEVEL DECISION ── center (410, 605), hw=150, hh=28 -->
  <polygon points="410,577 560,605 410,633 260,605" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="410" y="601" text-anchor="middle" fill="#451a03" font-size="12">Battery level?</text>
  <text x="410" y="617" text-anchor="middle" fill="#6b4600" font-size="11">High / Medium</text>

  <!-- HIGH: corner path right then down -->
  <path d="M 560,605 L 680,605 L 680,660" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="597" text-anchor="middle" fill="#666" font-size="11">High</text>

  <!-- HIGH: Green LED box -->
  <rect x="600" y="660" width="160" height="44" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="678" text-anchor="middle" fill="#064e3b">Set GREEN LED on</text>
  <text x="680" y="695" text-anchor="middle" fill="#064e3b">Arm RTC GPIO hold</text>

  <line x1="680" y1="704" x2="680" y2="734" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- HIGH: Set alarm -->
  <rect x="600" y="734" width="160" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="680" y="757" text-anchor="middle" fill="#1e3a5f">Set next 12 AM alarm</text>

  <line x1="680" y1="770" x2="680" y2="810" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- HIGH: Deep sleep -->
  <rect x="600" y="810" width="160" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="828" text-anchor="middle" fill="#14532d" font-weight="bold">Enter Deep Sleep</text>
  <text x="680" y="845" text-anchor="middle" fill="#166534" font-size="11">(GREEN LED held on)</text>

  <!-- MEDIUM: down -->
  <line x1="410" y1="633" x2="410" y2="680" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="422" y="659" fill="#666" font-size="11">Medium</text>

  <!-- MEDIUM: Set alarm -->
  <rect x="245" y="680" width="330" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="703" text-anchor="middle" fill="#1e3a5f">Set next 12 AM alarm</text>

  <line x1="410" y1="716" x2="410" y2="756" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MEDIUM: Deep sleep -->
  <rect x="245" y="756" width="330" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="779" text-anchor="middle" fill="#14532d" font-weight="bold">Enter Deep Sleep</text>

</svg>
